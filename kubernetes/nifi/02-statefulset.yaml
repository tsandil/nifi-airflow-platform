apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
  namespace: nifi
spec:
  serviceName: nifi-headless
  replicas: 1
  selector:
    matchLabels:
      app: nifi
  template:
    metadata:
      labels:
        app: nifi
        component: ingestion
    spec:
      containers:
      - name: nifi
        image: apache/nifi:1.23.2
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NIFI_WEB_HTTP_PORT
          value: "8080"
        - name: NIFI_WEB_HTTP_HOST
          value: "0.0.0.0"
        - name: SINGLE_USER_CREDENTIALS_USERNAME
          value: "admin"
        - name: SINGLE_USER_CREDENTIALS_PASSWORD
          value: "adminadminadmin"
        - name: NIFI_JVM_HEAP_INIT
          value: "512m"
        - name: NIFI_JVM_HEAP_MAX
          value: "1g"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "3072Mi"
            cpu: "2000m"
        volumeMounts:
        - name: nifi-data
          mountPath: /opt/nifi/nifi-current/content_repository
          subPath: content_repository
        - name: nifi-data
          mountPath: /opt/nifi/nifi-current/database_repository
          subPath: database_repository
        - name: nifi-data
          mountPath: /opt/nifi/nifi-current/flowfile_repository
          subPath: flowfile_repository
        - name: nifi-data
          mountPath: /opt/nifi/nifi-current/provenance_repository
          subPath: provenance_repository
        - name: nifi-data
          mountPath: /opt/nifi/nifi-current/logs
          subPath: logs
        - name: nifi-data
          mountPath: /opt/nifi/nifi-current/extensions
          subPath: extensions
        - name: nifi-data
          mountPath: /opt/nifi/nifi-current/extra-jars
          subPath: extra-jars
        livenessProbe:
          httpGet:
            path: /nifi
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /nifi
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3  
  volumeClaimTemplates:
  - metadata:
      name: nifi-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 5Gi
          