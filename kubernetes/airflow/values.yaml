executor: "LocalExecutor"

# Airflow 3.x renamed webserver -> apiServer
apiServer: 
  replicas: 1 
  resources:
    requests:
      cpu: "100m" 
      memory: "512Mi" 
    limits:
      memory: "1500Mi" 
  service: 
    type: NodePort 
    ports: 
      - name: airflow-ui 
        port: 8080
        nodePort: 30081

# Scheduler Configuration - Scheduler runs DAGs directly under LocalExecutor
scheduler: 
  replicas: 1 
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi" 
    limits:
      cpu: "500m" 
      memory: "1Gi" 

# Triggerer handles deferable operators (async tasks)
triggerer:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "768Mi"

# DAG processor is new in Airflow 3.x - parses DAG files
dagProcessor:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

# PostgreSQL - Use external PostgreSQL 
postgresql: 
  enabled: false 

# Database Connection - cross-namespace DNS format
# Format: <service>.<namespace>.svc.cluster.local
data: 
  metadataConnection: 
    user: postgres
    pass: postgres 
    protocol: postgresql 
    host: postgres.postgres.svc.cluster.local
    port: 5432 
    db: airflow 

# Environment Variables
env:
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "False"
  - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
    value: "True"
  - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
    value: "False"

# DAGs storage
dags:
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard
  gitSync:
    enabled: False

# Logs - disabled persistence for local dev
logs:
  persistence: 
    enabled: false 


# Install your package from TestPyPI
extraPipPackages:
  - "--index-url https://test.pypi.org/simple/"
  - "--extra-index-url https://pypi.org/simple"
  - "airflow-nifi-pipeline-utils==1.1.2"

# Create default admin user
webserverSecretKey: "THIS_IS_A_VERY_SECURE_KEY_CHANGE_ME"

# Default user credentials
defaultUser:
  enabled: true
  role: Admin
  username: admin
  email: admin@example.com
  firstName: Admin
  lastName: User
  password: admin

# Disabled - not needed for LocalExecutor setup
flower:
  enabled: false
redis:
  enabled: false
statsd:
  enabled: false
pgbouncer:
  enabled: false
workers: 
  replicas: 0
